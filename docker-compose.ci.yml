services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - APP_ENV=dev
      - APP_DATABASE__URL=sqlite://./data/platform.db?mode=rwc
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8080
      - APP_SERVER__RATE_LIMIT__PER_SECOND=100
      - APP_SERVER__RATE_LIMIT__BURST_SIZE=1000
    healthcheck:
      test: ["NONE"]

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 2s
      timeout: 3s
      retries: 10
