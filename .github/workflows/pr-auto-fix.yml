name: PR Auto-Fix

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to auto-fix"
        required: true
        type: string
      head_branch:
        description: "PR head branch name"
        required: true
        type: string
      head_sha:
        description: "PR head SHA"
        required: true
        type: string
      max_iterations:
        description: "Max auto-fix iterations (default 10)"
        required: false
        type: string
        default: "10"

jobs:
  resolve:
    uses: link-seek/issue-resolver/.github/workflows/resolve.yml@main
    with:
      pr-number: ${{ inputs.pr_number }}
      head-branch: ${{ inputs.head_branch }}
      head-sha: ${{ inputs.head_sha }}
      max-iterations: ${{ inputs.max_iterations }}
    secrets: inherit
