name: Sync and Deploy

# 触发: GHCR 镜像发布 (registry_package)
# 官方 payload: github.event.package_version.metadata.container.tags 包含 tag 数组
# 薄壳: 调用流程仓的 deploy-pipeline.yml reusable workflow

on:
  registry_package:
    types: [published, updated]
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag (for manual test)'
        required: true
        type: string

permissions:
  packages: read
  contents: read
  issues: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Extract image tag from registry_package payload
        id: extract
        run: |
          # workflow_dispatch: tag 从 input 取
          if [ -n "${{ inputs.image-tag }}" ]; then
            echo "tag=${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # registry_package: dump event for debugging, then extract tag
          echo "=== Full event payload ==="
          echo '${{ toJson(github.event) }}' | jq .
          echo "=== package_version ==="
          echo '${{ toJson(github.event.package_version) }}' | jq .
          TAGS='${{ toJson(github.event.package_version.metadata) }}'
          echo "metadata: $TAGS"
          # Try multiple possible paths
          TAG=$(echo "$TAGS" | jq -r '.container.tags[]? | select(. != "latest")' 2>/dev/null | head -1)
          if [ -z "$TAG" ]; then
            TAG=$(echo "$TAGS" | jq -r '.[]? | select(. != "latest")' 2>/dev/null | head -1)
          fi
          if [ -z "$TAG" ]; then
            echo "No non-latest tag found, skipping"
            exit 1
          fi
          echo "Resolved tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: resolve-tag
    uses: link-seek/issue-resolver/.github/workflows/deploy-pipeline.yml@main
    with:
      image-tag: ${{ needs.resolve-tag.outputs.tag }}
      runner-label: eap-prod
      ghcr-image: ghcr.io/link-seek/eap-backend
      acr-registry: crpi-fswclfmtgfktdkq7.cn-guangzhou.personal.cr.aliyuncs.com
      acr-namespace: eap-app
      acr-repo: backend
      frontend-url: https://www.xieyucheng.top
      api-url: https://api.xieyucheng.top
      issue-repo: link-seek/enterprise-architecture-platform
      deploy-script: |
        IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}:${IMAGE_TAG}"
        podman pull "$IMAGE"
        podman stop eap-backend 2>/dev/null || true
        podman rm eap-backend 2>/dev/null || true
        podman run -d --name eap-backend --replace \
          -p 8080:8080 \
          -v /opt/eap/data:/app/data \
          -e APP_ENV=production \
          -e APP_DATABASE__URL=sqlite:///app/data/platform.db?mode=rwc \
          -e APP_LLM__BACKEND=llm \
          -e APP_SEED_ADMIN_EMAIL=xieyucheng@outlook.com \
          -e APP_SEED_ADMIN_PASSWORD=***REDACTED*** \
          -e RUST_LOG=info,sqlx::pool=warn \
          "$IMAGE"
        nohup podman logs -f eap-backend >> /var/log/eap/backend.log 2>&1 &
    secrets: inherit
