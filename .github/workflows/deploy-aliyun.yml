name: Sync and Deploy

# 触发: GHCR 镜像发布 (registry_package)
# 官方 payload: github.event.package_version.metadata.container.tags 包含 tag 数组
# 薄壳: 调用流程仓的 deploy-pipeline.yml reusable workflow

on:
  registry_package:
    types: [published, updated]
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag (for manual test)'
        required: true
        type: string

permissions:
  packages: read
  contents: read
  issues: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Extract image tag from registry_package payload
        id: extract
        run: |
          # workflow_dispatch: tag 从 input 取
          if [ -n "${{ inputs.image-tag }}" ]; then
            echo "tag=${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # registry_package: 从 payload metadata.container.tags 取
          TAGS='${{ toJson(github.event.package_version.metadata.container.tags) }}'
          echo "All tags: $TAGS"
          TAG=$(echo "$TAGS" | jq -r '.[] | select(. != "latest")' | head -1)
          if [ -z "$TAG" ]; then
            echo "No non-latest tag found, skipping"
            exit 1
          fi
          echo "Resolved tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: resolve-tag
    uses: link-seek/issue-resolver/.github/workflows/deploy-pipeline.yml@main
    with:
      image-tag: ${{ needs.resolve-tag.outputs.tag }}
      runner-label: eap-prod
      ghcr-image: ghcr.io/link-seek/eap-backend
      acr-registry: crpi-fswclfmtgfktdkq7.cn-guangzhou.personal.cr.aliyuncs.com
      acr-namespace: eap-app
      acr-repo: backend
      frontend-url: https://www.xieyucheng.top
      api-url: https://api.xieyucheng.top
      issue-repo: link-seek/enterprise-architecture-platform
      deploy-script: /opt/eap/eap-autodeploy.sh
    secrets: inherit
