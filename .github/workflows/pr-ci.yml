name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline-contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: link-seek/issue-resolver
          path: _issue-resolver
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate pipeline config
        run: |
          cd ${{ github.workspace }}
          PYTHONPATH="_issue-resolver/scripts:$PYTHONPATH" python _issue-resolver/scripts/validate_config.py

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Run cargo test
        working-directory: backend
        run: cargo test --workspace

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npx vite build

  integration:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health 2>/dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          docker compose -f docker-compose.ci.yml logs backend
          exit 1

      - name: Wait for frontend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:80/health 2>/dev/null; then
              echo "Frontend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start"
          docker compose -f docker-compose.ci.yml logs frontend
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: frontend

      - name: Run Playwright E2E tests
        env:
          CI: "true"
        run: |
          # Frontend is served by nginx in docker on port 80
          # Playwright tests use baseURL http://localhost:80
          # Run spaces + auth tests (known to pass with seeded data)
          npx playwright test tests/spaces tests/auth --reporter=line
        working-directory: frontend

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml down
