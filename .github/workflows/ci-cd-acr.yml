name: Build and Push Images

on:
  push:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and push backend
        id: build
        env:
          IMAGE: ghcr.io/link-seek/eap-backend
        run: |
          TAG="$(date -u +%Y%m%d%H%M%S)-${{ github.sha }}"
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${TAG}" ./backend
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${TAG}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Cleanup old GHCR versions (keep latest 5)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          IDS=$(gh api /orgs/link-seek/packages/container/eap-backend/versions --paginate -q '. | sort_by(.created_at) | reverse | .[5:] | .[].id' 2>/dev/null || true)
          for id in $IDS; do
            echo "Deleting old GHCR version: $id"
            gh api -X DELETE /orgs/link-seek/packages/container/eap-backend/versions/$id || true
          done

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://api.xieyucheng.top/api
        run: npm run build

      - name: Install ossutil
        run: |
          curl -L -o ossutil https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil && sudo mv ossutil /usr/local/bin/ossutil

      - name: Upload to OSS and set public-read
        run: |
          ossutil config \
            -e "oss-cn-shenzhen.aliyuncs.com" \
            -i "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" \
            -k "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}"
          ossutil cp -rf frontend/dist/ "oss://eap-frontend-xyc/" --acl public-read
