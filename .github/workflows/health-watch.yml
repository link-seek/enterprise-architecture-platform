name: Health Watch
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  health-check:
    runs-on: [self-hosted, eap-prod]
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Check health and create issue if down
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
          ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
        run: |
          set +e
          HEALTH=$(curl -s --connect-timeout 10 http://localhost:8080/health 2>/dev/null || echo "")
          
          if [ -z "$HEALTH" ]; then
            echo "Server not responding (empty response)"
            DB_STATUS="down"
            DB_ERROR="server not responding (empty reply)"
          else
            DB_STATUS=$(echo "$HEALTH" | python3 -c "import json,sys; print(json.load(sys.stdin).get('db','unknown'))" 2>/dev/null || echo "parse_error")
            DB_ERROR=$(echo "$HEALTH" | python3 -c "import json,sys; e=json.load(sys.stdin).get('db_error'); print(e if e else '')" 2>/dev/null || echo "")
          fi
          
          echo "DB status: $DB_STATUS"
          echo "DB error: $DB_ERROR"
          
          if [ "$DB_STATUS" = "up" ]; then
            echo "DB is up, no action needed"
            exit 0
          fi
          
          echo "DB is down, checking for existing open issue..."
          EXISTING=$(curl -s "https://api.github.com/repos/$REPO/issues?labels=deploy-broken&state=open" \
            -H "Authorization: token $GH_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')" 2>/dev/null || echo "")
          
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already exists, skipping"
            exit 0
          fi
          
          echo "Querying SLS for recent error logs..."
          SLS_LOGS=""
          if command -v aliyun &>/dev/null; then
            SLS_LOGS=$(aliyun sls GetLogs --project=eap-prod --logstore=backend --from=$(($(date +%s) - 300)) --to=$(date +%s) --query='level: error | select timestamp, level, message, target, error limit 10' --line=10 2>/dev/null || echo "")
          fi
          
          echo "Creating issue..."
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          BODY="## Health Watch Alert
          
          **Time**: $TIMESTAMP
          **DB Status**: $DB_STATUS
          **DB Error**: $DB_ERROR
          
          ### Health Response
          \`\`\`
          $HEALTH
          \`\`\`
          
          ### SLS Error Logs (last 5 min)
          \`\`\`
          $SLS_LOGS
          \`\`\`
          
          ### SLS Console
          https://sls.console.aliyun.com/lognext/project/eap-prod/logsearch/backend?query=level%3A%20error
          
          ### Action Needed
          - Check SLS logs above for error details
          - Fix root cause
          - This issue was auto-created by health-watch workflow"
          
          # Use GitHub API directly (gh not available on self-hosted runner)
          curl -s -X POST "https://api.github.com/repos/$REPO/issues" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "
          import json
          print(json.dumps({
            'title': 'health-watch: DB down at $TIMESTAMP',
            'labels': ['deploy-broken', 'error-smoke'],
            'body': '''$BODY'''
          }))
          ")"
          
          exit 0
