name: On Quick Fix

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to quick-fix"
        required: true
        type: string
      head_branch:
        description: "PR head branch name"
        required: true
        type: string
      head_sha:
        description: "PR head SHA"
        required: true
        type: string
      ci_failures:
        description: "CI failure context (error logs)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: fix-agent
  cancel-in-progress: false

jobs:
  quick-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name "ai-bot"
          git config --global user.email "bot@ai-resolver.dev"

      - name: Check quick-fix failure count
        id: fail-count
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          FAIL_COUNT=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --jq '[.[] | select(.body | test("\\[quick-fix-fail"))] | length' 2>/dev/null || echo "0")
          echo "fail_count=$FAIL_COUNT" >> $GITHUB_OUTPUT
          echo "Quick-fix failures so far: $FAIL_COUNT (max 5)"
          if [ "$FAIL_COUNT" -ge 5 ]; then
            echo "fallback=true" >> $GITHUB_OUTPUT
          else
            echo "fallback=false" >> $GITHUB_OUTPUT
          fi

      - name: Fallback to OH (full auto-fix)
        if: steps.fail-count.outputs.fallback == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          echo "Quick-fix failed >=5 times, falling back to OH..."
          gh workflow run on-comment-fix.yml \
            -f pr_number="$PR_NUMBER" \
            -f head_branch="$HEAD_BRANCH" \
            -f head_sha="$HEAD_SHA" \
            -f max_iterations="10"
          gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments \
            -f body="⚠️ Quick-fix (opencode+Zen) 失败 ≥5 次，已回退到 OH 全量修复。"

      - name: Install opencode
        if: steps.fail-count.outputs.fallback != 'true'
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Write opencode config
        if: steps.fail-count.outputs.fallback != 'true'
        run: |
          cat > opencode.json << 'EOF'
          {
            "permission": {
              "bash": "allow",
              "edit": "allow",
              "write": "allow",
              "read": "allow"
            }
          }
          EOF
          echo "opencode.json" >> .gitignore

      - name: Run opencode quick-fix
        id: opencode-run
        if: steps.fail-count.outputs.fallback != 'true'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CI_FAILURES: ${{ inputs.ci_failures }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Running opencode quick-fix for PR #$PR_NUMBER..."
          opencode run \
            --model opencode/deepseek-v4-flash-free \
            --auto \
            "Fix the CI test failures for PR #$PR_NUMBER in this repository.

          CI Failure Details:
          $CI_FAILURES

          Rules:
          - Fix ONLY the reported CI failures, do not add features or refactor
          - For Playwright strict mode violations, make selectors more specific (use .first(), getByRole, or more exact text)
          - After fixing, run: git add -A && git commit -m 'quick-fix: resolve CI failures' && git push
          - Push to the current branch (origin HEAD)" || echo "OPENCODE_EXIT=$?" >> $GITHUB_ENV

      - name: Check if changes were pushed
        if: steps.fail-count.outputs.fallback != 'true' && always()
        id: check-push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
        run: |
          REMOTE_SHA=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER --jq '.head.sha' 2>/dev/null || echo "")
          LOCAL_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
          echo "remote_sha=$REMOTE_SHA" >> $GITHUB_OUTPUT
          echo "local_sha=$LOCAL_SHA" >> $GITHUB_OUTPUT
          if [ "$REMOTE_SHA" != "$HEAD_SHA" ] && [ -n "$REMOTE_SHA" ]; then
            echo "pushed=true" >> $GITHUB_OUTPUT
            echo "Changes detected: $HEAD_SHA -> $REMOTE_SHA"
          else
            echo "pushed=false" >> $GITHUB_OUTPUT
            echo "No changes pushed"
          fi

      - name: Record success
        if: steps.fail-count.outputs.fallback != 'true' && steps.check-push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments \
            -f body="✅ Quick-fix (opencode+Zen) pushed changes. Waiting for CI..."

      - name: Record failure
        if: steps.fail-count.outputs.fallback != 'true' && (failure() || steps.check-push.outputs.pushed == 'false')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          FAIL_COUNT=${{ steps.fail-count.outputs.fail_count }}
          NEW_COUNT=$((FAIL_COUNT + 1))
          gh api repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments \
            -f body="🤖 [quick-fix-fail #$NEW_COUNT] opencode+Zen quick-fix did not succeed ($NEW_COUNT/5). Will retry or fall back to OH after 5 failures."
