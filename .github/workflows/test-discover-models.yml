name: Test Model Discovery
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DISCUSS_KEY_1: ${{ secrets.DISCUSS_API_KEY_1 }}
      DISCUSS_KEY_2: ${{ secrets.DISCUSS_API_KEY_2 }}
      DISCUSS_KEY_3: ${{ secrets.DISCUSS_API_KEY_3 }}
      DISCUSS_BASE: ${{ secrets.DISCUSS_API_BASE }}
      DISCUSS_MODEL: "muse-spark-1.2-contributor-free"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: link-seek/issue-resolver-l1
          ref: main
          path: scripts

      - name: Run discover_free_models.py
        run: |
          python scripts/scripts/discover_free_models.py
          
          echo ""
          echo "=== Generated LiteLLM Config ==="
          cat /tmp/litellm_config.yaml
          
          echo ""
          echo "=== Verify muse-spark is primary ==="
          if grep -q "openai/responses/muse-spark-1.2-contributor-free" /tmp/litellm_config.yaml; then
            echo "✅ muse-spark is configured with /responses endpoint"
          else
            echo "❌ muse-spark NOT configured correctly"
            exit 1
          fi
          
          echo ""
          echo "=== Test direct API call ==="
          python3 -c "
          import os, json, urllib.request
          
          API = os.environ['DISCUSS_BASE']
          KEY = os.environ['DISCUSS_KEY_1']
          
          # Test muse-spark via /responses
          body = json.dumps({'model': 'muse-spark-1.2-contributor-free', 'input': 'Say hi', 'stream': False}).encode()
          req = urllib.request.Request(
              f'{API}/responses',
              data=body,
              headers={
                  'Authorization': f'Bearer {KEY}',
                  'Content-Type': 'application/json',
                  'User-Agent': 'OpenCode-Discuss/1.0',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
                  print(f'muse-spark via /responses: HTTP {resp.status} OK | status={data.get(\"status\")}')
          except urllib.error.HTTPError as e:
              body = e.read().decode()[:300]
              print(f'muse-spark via /responses: HTTP {e.code} {e.reason} | {body}')
          except Exception as e:
              print(f'muse-spark via /responses: FAIL {e}')
          
          # Test mimo-v2.5-free via /chat/completions
          body = json.dumps({'model': 'mimo-v2.5-free', 'max_tokens': 1, 'messages': [{'role': 'user', 'content': 'hi'}]}).encode()
          req = urllib.request.Request(
              f'{API}/chat/completions',
              data=body,
              headers={
                  'Authorization': f'Bearer {KEY}',
                  'Content-Type': 'application/json',
                  'User-Agent': 'OpenCode-Discuss/1.0',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
                  content = data.get('choices', [{}])[0].get('message', {}).get('content', 'N/A')
                  print(f'mimo-v2.5-free via /chat/completions: HTTP {resp.status} OK | reply: {content[:50]}')
          except urllib.error.HTTPError as e:
              body = e.read().decode()[:300]
              print(f'mimo-v2.5-free via /chat/completions: HTTP {e.code} {e.reason} | {body}')
          except Exception as e:
              print(f'mimo-v2.5-free via /chat/completions: FAIL {e}')
          "
