name: Diagnose ECS
on: workflow_dispatch
jobs:
  diag:
    runs-on: eap-prod
    steps:
      - run: |
          echo "=== podman ps ==="
          podman ps -a --filter name=eap-backend
          echo "=== podman logs (last 50) ==="
          podman logs eap-backend --tail 50 2>&1 || true
          echo "=== curl localhost ==="
          curl -sf http://localhost:8080/health 2>&1 || echo "FAILED"
