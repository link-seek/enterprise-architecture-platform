name: Restart ECS
on: workflow_dispatch
jobs:
  restart:
    runs-on: eap-prod
    steps:
      - run: |
          echo "=== podman top ==="
          podman top eap-backend aux 2>&1 || true
          echo "=== restart ==="
          podman restart eap-backend
          sleep 5
          echo "=== logs after restart ==="
          podman logs --tail 20 eap-backend 2>&1
          echo "=== curl test ==="
          sleep 3
          curl -sf http://localhost:8080/health 2>&1 || echo "FAILED"
