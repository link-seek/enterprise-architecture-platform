name: Diagnose ECS2
on: workflow_dispatch
jobs:
  diag:
    runs-on: eap-prod
    steps:
      - run: |
          echo "=== podman ps ==="
          podman ps -a --filter name=eap-backend
          echo "=== podman logs ==="
          podman logs --tail 50 eap-backend 2>&1 || true
          echo "=== curl localhost ==="
          curl -sv http://localhost:8080/health 2>&1 || echo "FAILED"
          echo "=== podman inspect ==="
          podman inspect eap-backend --format '{{.State.Status}} {{.State.ExitCode}} {{.State.Error}}' 2>&1 || true
