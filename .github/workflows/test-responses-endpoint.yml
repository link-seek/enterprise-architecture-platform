name: Test Responses Endpoint
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.DISCUSS_API_KEY_1 }}
      BASE: ${{ secrets.DISCUSS_API_BASE }}
    steps:
      - name: Test /responses endpoint
        run: |
          python3 -c "
          import os, json, urllib.request

          API = os.environ['BASE']
          KEY = os.environ['KEY']

          # Models that should use /responses
          responses_models = ['muse-spark-1.2-contributor-free']
          # Models that should use /chat/completions
          chat_models = ['mimo-v2.5-free', 'big-pickle']

          print('=== Testing /responses endpoint ===')
          for m in responses_models:
              body = json.dumps({'model': m, 'input': 'Say hi', 'stream': False}).encode()
              req = urllib.request.Request(
                  f'{API}/responses',
                  data=body,
                  headers={
                      'Authorization': f'Bearer {KEY}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'OpenCode-Discuss/1.0',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode())
                      print(f'{m}: HTTP {resp.status} OK | status={data.get(\"status\")} | output={str(data.get(\"output\",\"\"))[:100]}')
              except urllib.error.HTTPError as e:
                  body = e.read().decode()[:300]
                  print(f'{m}: HTTP {e.code} {e.reason} | {body}')
              except Exception as e:
                  print(f'{m}: FAIL {e}')

          print()
          print('=== Testing /chat/completions endpoint ===')
          for m in chat_models:
              body = json.dumps({'model': m, 'max_tokens': 1, 'messages': [{'role': 'user', 'content': 'hi'}]}).encode()
              req = urllib.request.Request(
                  f'{API}/chat/completions',
                  data=body,
                  headers={
                      'Authorization': f'Bearer {KEY}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'OpenCode-Discuss/1.0',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode())
                      content = data.get('choices', [{}])[0].get('message', {}).get('content', 'N/A')
                      print(f'{m}: HTTP {resp.status} OK | reply: {content[:100]}')
              except urllib.error.HTTPError as e:
                  body = e.read().decode()[:300]
                  print(f'{m}: HTTP {e.code} {e.reason} | {body}')
              except Exception as e:
                  print(f'{m}: FAIL {e}')
          "
