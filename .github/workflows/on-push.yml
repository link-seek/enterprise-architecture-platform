name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write
  issues: write
  pull-requests: write
  checks: write

jobs:
  e2e-test:
    uses: link-seek/issue-resolver-l1/.github/workflows/e2e-test.yml@v1.0.24-pilot
    with:
      ref: ''
    secrets: inherit

  ci-cd:
    needs: e2e-test
    if: needs.e2e-test.result == 'success'
    uses: link-seek/issue-resolver-l1/.github/workflows/ci-cd-acr.yml@v1.0.24-pilot
    with:
      ghcr-image: ghcr.io/link-seek/eap-backend
      # 前端统一走 Cloudflare Pages（见 deploy-frontend job），不再推 OSS。
      # oss-bucket 留空 = L1 build-frontend 直接跳过。
      frontend-build-env: '["VITE_API_URL=https://eap-api.linkseek.net.cn/api"]'
    secrets: inherit

  # 前端统一发布通道：构建 + wrangler 直传 CF Pages（ad_hoc）。
  # 后端 GHCR push 触发 on-deploy 做 ECS 发布；L1 deploy.yml 内 cf-wait 记基线、
  # smoke 失败时 rollback.sh 回滚后端 + Pages API 回滚前端。
  deploy-frontend:
    needs: e2e-test
    if: needs.e2e-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://eap-api.linkseek.net.cn/api
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 47ce24ced58f17c9fb15351adcbe67d4
        run: |
          npx -y wrangler@4 pages deploy ./dist \
            --project-name=eap-frontend \
            --branch=main \
            --commit-hash="${{ github.sha }}"

  create-e2e-issue:
    needs: e2e-test
    runs-on: ubuntu-latest
    if: always() && needs.e2e-test.result == 'failure'
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create E2E failure issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:12}"
          # Check if issue already exists for this SHA
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=deploy-broken" \
            --jq ".[] | select(.title | contains(\"$SHORT_SHA\")) | .number" 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already exists for SHA $SHORT_SHA"
            exit 0
          fi
          # Download E2E logs for error details
          gh api repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs > /tmp/logs.zip 2>/dev/null || true
          mkdir -p /tmp/logs && cd /tmp/logs && unzip -o /tmp/logs.zip 2>/dev/null || true
          E2E_ERRORS=$(grep -rhi "failed\|error\|Error\|timeout" ./*.txt 2>/dev/null | tail -30 || echo "No logs found")
          # Create issue
          gh api repos/$GITHUB_REPOSITORY/issues \
            -f title="deploy-broken: E2E test failed (SHA $SHORT_SHA)" \
            --raw-field body="## E2E Test Failed

          **Commit**: \\`$SHA\\`
          **Run**: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID

          ### Error details
          \\`\\`\\`
          $E2E_ERRORS
          \\`\\`\\`
          " \
            -f "labels[]=deploy-broken" \
            -f "labels[]=fix-me"
