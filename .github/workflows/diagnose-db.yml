name: Diagnose DB
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: [self-hosted, eap-prod]
    steps:
      - run: |
          echo "=== DB files ==="
          ls -la /opt/eap/data/platform.db /opt/eap/data/.platform.db.pre-deploy /opt/eap/data/.previous-image 2>&1
          echo "=== All files in /opt/eap/data/ ==="
          ls -la /opt/eap/data/ 2>&1
          echo "=== DB integrity ==="
          sqlite3 /opt/eap/data/platform.db 'PRAGMA integrity_check;' 2>&1
          echo "=== Container status ==="
          podman ps -a --filter name=eap-backend 2>&1
          echo "=== Health check ==="
          curl -s http://localhost:8080/health 2>&1
          echo "=== Container logs (last 30 lines) ==="
          podman logs --tail 30 eap-backend 2>&1
