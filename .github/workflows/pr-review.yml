name: PR Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  continue-fix:
    if: ${{ github.event_name == 'issue_comment' && github.event.comment.body == 'continue-fix' && github.event.issue.pull_request != null && contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - name: Log continue-fix trigger
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ASSOC: ${{ github.event.comment.author_association }}
        run: |
          echo "continue-fix on PR #$PR_NUMBER by $COMMENTER ($ASSOC)"

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get PR info and dispatch auto-fix
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR_INFO=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER \
            --jq '{head_branch: .head.ref, head_sha: .head.sha}')
          HEAD_BRANCH=$(echo "$PR_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_branch'])")
          HEAD_SHA=$(echo "$PR_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_sha'])")

          echo "Dispatching auto-fix for PR #$PR_NUMBER (branch: $HEAD_BRANCH)"
          echo "max_iterations=20 (10 original + 10 continue)"

          GH_TOKEN="$DISPATCH_TOKEN" gh workflow run pr-auto-fix.yml \
            -f pr_number="$PR_NUMBER" \
            -f head_branch="$HEAD_BRANCH" \
            -f head_sha="$HEAD_SHA" \
            -f max_iterations="20" || echo "Failed to dispatch auto-fix"

      - name: React to comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content="rocket" 2>/dev/null || true

  e2e-coverage-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check E2E test coverage
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Get list of changed files in the PR
          CHANGED_FILES=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files --paginate --jq '.[].filename')

          # Check if any testable frontend source files changed
          # Inclusion list: only views/, api/, stores/, lib/apollo need E2E tests
          FRONTEND_SRC_CHANGES=$(echo "$CHANGED_FILES" | grep -E '^frontend/src/' \
            | grep -E '^frontend/src/(views/|api/|stores/|lib/apollo)' || true)

          # If no frontend source files changed, skip E2E check
          if [ -z "$FRONTEND_SRC_CHANGES" ]; then
            echo "No testable frontend source changes — skipping E2E coverage check"
            exit 0
          fi

          echo "Frontend source changes:"
          echo "$FRONTEND_SRC_CHANGES"

          # Source area → required test dir mapping
          # Check each area: if source in area changed, PR must include test changes in the corresponding test dir
          MISSING=()

          check_area() {
            local src_pattern="$1" test_dir="$2" label="$3"
            if echo "$FRONTEND_SRC_CHANGES" | grep -qE "$src_pattern"; then
              if ! echo "$CHANGED_FILES" | grep -qE "^frontend/tests/${test_dir}/.*\.spec\.ts$"; then
                MISSING+=("$label: $src_pattern changed but no tests/${test_dir}/*.spec.ts in PR")
              fi
            fi
          }

          check_area 'frontend/src/(views/spaces|api/spaces)'   'spaces'              'spaces'
          check_area 'frontend/src/(views/login|api/auth|stores/auth)' 'auth'         'auth'
          check_area 'frontend/src/lib/apollo'                  'spaces'              'apollo'
          check_area 'frontend/src/views/architectures/value-stream' 'value-stream'   'value-stream'
          check_area 'frontend/src/views/architectures/capabilities' 'business-capabilities' 'capabilities'
          check_area 'frontend/src/views/architectures/processes'    'business-processes'    'processes'
          check_area 'frontend/src/views/architectures/(crud|layout|users|version-control)' 'spaces' 'architecture'

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::E2E test coverage missing:"
            for msg in "${MISSING[@]}"; do
              echo "  - $msg"
            done
            exit 1
          fi

          echo "E2E test coverage OK — PR includes corresponding test changes"

          # Second layer: verify test specs are in the core list (CI will actually run them)
          CORE_SPECS_FILE=".github/e2e-core-specs.txt"
          if [ -f "$CORE_SPECS_FILE" ]; then
            CORE_SPECS=$(grep -v '^#' "$CORE_SPECS_FILE" | tr '\n' ' ')
            NOT_IN_CORE=()
            for test_dir in spaces auth value-stream business-capabilities business-processes; do
              if echo "$CHANGED_FILES" | grep -qE "^frontend/tests/${test_dir}/.*\.spec\.ts$"; then
                # Check if any spec from this dir is in the core list
                if ! echo "$CORE_SPECS" | grep -qF "tests/${test_dir}/"; then
                  NOT_IN_CORE+=("tests/${test_dir}/*.spec.ts exists but not in e2e-core-specs.txt — CI won't run it")
                fi
              fi
            done
            if [ ${#NOT_IN_CORE[@]} -gt 0 ]; then
              echo "::warning::E2E specs exist but not in core list (CI won't execute them):"
              for msg in "${NOT_IN_CORE[@]}"; do
                echo "  - $msg"
              done
              echo "Add stable specs to .github/e2e-core-specs.txt after 5 consecutive passes"
            fi
          fi

  review-ai:
    if: ${{ github.event_name == 'pull_request' }}
    needs: [e2e-coverage-check]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: review-ai-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch linked issue content for requirement coverage check
        id: issue-context
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Extract issue number from PR body (e.g. "Fix #201" or "(#201)")
          PR_BODY=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER --jq '.body')
          ISSUE_NUM=$(echo "$PR_BODY" | grep -oP '#(\d+)' | head -1 | tr -d '#')
          
          if [ -z "$ISSUE_NUM" ]; then
            # Try branch name (e.g. agent/fix-issue-201)
            BRANCH=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER --jq '.head.ref')
            ISSUE_NUM=$(echo "$BRANCH" | grep -oP 'issue-(\d+)' | head -1 | sed 's/issue-//')
          fi
          
          if [ -n "$ISSUE_NUM" ]; then
            echo "Found linked issue #$ISSUE_NUM"
            ISSUE_BODY=$(gh api repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUM --jq '.body' 2>/dev/null || echo "")
            ISSUE_TITLE=$(gh api repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUM --jq '.title' 2>/dev/null || echo "")
            
            # Write issue content to a file that the review agent can read
            cat > .pr-review-issue-context.md << EOF
          ## Linked Issue Requirements (Issue #$ISSUE_NUM)
          
          **Title**: $ISSUE_TITLE
          
          **Requirements**:
          $ISSUE_BODY
          
          ---
          ## Requirement Coverage Check
          
          When reviewing this PR, also check:
          1. **Completeness**: Are all requirements from the issue implemented?
          2. **Correctness**: Does the implementation match what the issue describes?
          3. **Gaps**: List any requirements that are NOT addressed in the code.
          4. **Extra**: List any significant code changes NOT related to the issue requirements.
          
          Include a "Requirement Coverage" section in your review.
          EOF
            echo "has_issue=true" >> $GITHUB_OUTPUT
          else
            echo "No linked issue found"
            echo "has_issue=false" >> $GITHUB_OUTPUT
          fi

      - name: Run OpenHands Review
        uses: OpenHands/extensions/plugins/pr-review@main
        with:
          llm-model: ${{ secrets.LLM_MODEL || 'openai/glm-5.2' }}
          llm-base-url: ${{ secrets.LLM_BASE_URL || 'https://api.modelarts-maas.com/v2' }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check AI Review Verdict
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          VERDICT="UNKNOWN"
          REVIEW_BODY=""
          for i in 1 2 3 4 5 6; do
            sleep 5
            REVIEW_JSON=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews \
              --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.commit_id // \"\") == \"$HEAD_SHA\")] | sort_by(.submitted_at) | last | {state: .state, body: .body}" 2>/dev/null || echo "{}")
            VERDICT=$(echo "$REVIEW_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")
            if [ "$VERDICT" != "null" ] && [ "$VERDICT" != "UNKNOWN" ] && [ -n "$VERDICT" ]; then
              REVIEW_BODY=$(echo "$REVIEW_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))" 2>/dev/null || echo "")
              break
            fi
            echo "Retry $i: verdict not ready yet ($VERDICT)"
          done

          echo "Latest AI review verdict: $VERDICT"

          # Severity check: 🔴 Critical / 🟠 Important → block + auto-fix
          # 🟡 Medium / improvement → advisory, pass
          # Only check the OVERALL verdict (first line + RISK ASSESSMENT line),
          # NOT every emoji in the body (review text may reference 🔴/🟠 in passing)
          has_blocking_severity() {
            # 1. Check first line — review-ai starts with overall severity emoji
            #    Anchor with ^ to avoid matching 🔴/🟠 mentioned in prose
            FIRST_LINE=$(echo "$REVIEW_BODY" | head -1)
            if echo "$FIRST_LINE" | grep -qE '^(🔴|🟠)'; then
              return 0
            fi
            # 2. Check [RISK ASSESSMENT] → [Overall PR] line for 🔴 or 🟠
            #    Match only the "- [Overall PR]" bullet, not surrounding prose
            if echo "$REVIEW_BODY" | grep -A5 '^\*\*\[RISK ASSESSMENT\]\*\*' | grep -E '^\s*- \[Overall PR\]' | grep -qE '🔴|🟠'; then
              return 0
            fi
            # 3. Check for explicit [CRITICAL ISSUES] section with content
            if echo "$REVIEW_BODY" | grep -qE '^\*\*\[CRITICAL ISSUES\]\*\*' && \
               ! echo "$REVIEW_BODY" | grep -A1 '^\*\*\[CRITICAL ISSUES\]\*\*' | grep -qE '^(none|None|N/A|-)$'; then
              return 0
            fi
            return 1
          }

          dispatch_autofix() {
            echo "Dispatching PR Auto-Fix..."
            GH_TOKEN="$DISPATCH_TOKEN" gh workflow run pr-auto-fix.yml \
              -f pr_number="$PR_NUMBER" \
              -f head_branch="${{ github.event.pull_request.head.ref }}" \
              -f head_sha="$HEAD_SHA" || echo "Failed to dispatch auto-fix"
          }

          if [ "$VERDICT" = "APPROVED" ]; then
            echo "AI approved the PR"
          elif [ "$VERDICT" = "CHANGES_REQUESTED" ] || [ "$VERDICT" = "COMMENTED" ]; then
            if has_blocking_severity; then
              echo "::error::AI review has Critical/Important issues, blocking merge"
              dispatch_autofix
              exit 1
            else
              echo "AI review verdict: $VERDICT, but only advisory issues (🟡/no severity) — passing"
            fi
          else
            echo "::error::No AI review found (got: $VERDICT)"
            exit 1
          fi
