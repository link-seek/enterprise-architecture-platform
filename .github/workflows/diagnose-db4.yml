name: Diagnose DB4
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: [self-hosted, eap-prod]
    steps:
      - run: |
          set +e
          echo "=== Container env ==="
          podman inspect eap-backend --format '{{range .Config.Env}}{{println .}}{{end}}' 2>&1 | grep -i "DATABASE\|DB\|SQLITE"
          echo "=== Container mounts ==="
          podman inspect eap-backend --format '{{range .Mounts}}{{println .Source}} -> {{.Destination}}{{end}}' 2>&1
          echo "=== DB file from host ==="
          ls -la /opt/eap/data/platform.db 2>&1
          echo "=== DB file from container ==="
          podman exec eap-backend ls -la /app/data/platform.db 2>&1
          echo "=== Test DB query from container ==="
          podman exec eap-backend sh -c 'echo "SELECT count(*) FROM users;" | sqlite3 /app/data/platform.db' 2>&1
          echo "=== Health from inside container ==="
          podman exec eap-backend curl -s http://localhost:8080/health 2>&1
          echo ""
          echo "=== Try login from inside container ==="
          podman exec eap-backend curl -s -X POST http://localhost:8080/api/auth/login -H "Content-Type: application/json" -d '{"email":"test@example.com","password":"testpassword123"}' 2>&1
          echo ""
          echo "=== Full container logs ==="
          podman logs eap-backend 2>&1 | tail -80
          exit 0
