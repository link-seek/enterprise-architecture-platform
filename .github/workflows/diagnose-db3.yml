name: Diagnose DB3
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: [self-hosted, eap-prod]
    steps:
      - run: |
          set +e
          echo "=== DB files ==="
          ls -la /opt/eap/data/ 2>&1
          echo "=== DB size ==="
          ls -la /opt/eap/data/platform.db 2>&1
          echo "=== DB integrity ==="
          python3 << 'PY'
          import sqlite3
          try:
              conn = sqlite3.connect('/opt/eap/data/platform.db')
              cur = conn.execute('PRAGMA integrity_check')
              print('integrity:', cur.fetchone())
              cur = conn.execute('SELECT count(*) FROM sqlite_master')
              print('tables/views:', cur.fetchone())
              cur = conn.execute("SELECT name FROM sqlite_master WHERE type='table'")
              print('tables:', [r[0] for r in cur.fetchall()])
              conn.close()
          except Exception as e:
              print('ERROR:', e)
          PY
          echo "=== Container status ==="
          podman ps -a --filter name=eap-backend 2>&1
          echo "=== Health check ==="
          curl -s http://localhost:8080/health 2>&1
          echo ""
          echo "=== Container logs ==="
          podman logs --tail 50 eap-backend 2>&1
          exit 0
