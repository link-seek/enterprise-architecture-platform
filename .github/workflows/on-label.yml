name: On Label

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: fix-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'fix-me') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'continue-fix') && github.event.issue.pull_request == null && contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association))
    uses: link-seek/issue-resolver-l1/.github/workflows/fix.yml@main
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets: inherit

  deploy-broken:
    if: github.event_name == 'issues' && github.event.label.name == 'deploy-broken'
    uses: link-seek/issue-resolver-l1/.github/workflows/deploy-broken-handler.yml@main
    secrets: inherit
