name: Setup Logtail
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: [self-hosted, eap-prod]
    steps:
      - run: |
          set +e
          echo "=== Check if Logtail already installed ==="
          if [ -d /etc/ilogtail ]; then
            echo "Logtail already installed"
          else
            echo "Installing Logtail..."
            wget -q "http://logtail-release-cn-hangzhou.oss-cn-hangzhou.aliyuncs.com/linux64/logtail.sh" -O /tmp/logtail.sh
            chmod +x /tmp/logtail.sh
            /tmp/logtail.sh cn-hangzhou ${{ secrets.ALIYUN_AK }} ${{ secrets.ALIYUN_SK }} 2>&1
          fi
          
          echo "=== Ensure log dir exists ==="
          mkdir -p /var/log/eap
          
          echo "=== Check logtail status ==="
          /etc/ilogtail/ilogtail --version 2>&1 || echo "ilogtail not found"
          ps aux | grep ilogtail | grep -v grep 2>&1 || echo "ilogtail not running"
          
          exit 0
