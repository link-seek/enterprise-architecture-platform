name: Auto-resolve issues

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  discussions: write

jobs:
  resolve:
    if: github.event.label.name == 'fix-me'
    uses: link-seek/issue-resolver/.github/workflows/resolve.yml@main
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets: inherit

  discuss:
    uses: link-seek/issue-resolver/.github/workflows/auto-resolve.yml@main
    secrets: inherit
