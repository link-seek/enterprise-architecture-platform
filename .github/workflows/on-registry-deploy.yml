name: Sync and Deploy

# 触发: GHCR 镜像发布 (registry_package)
# Payload: github.event.registry_package.package_version.container_metadata.tag.name
# 薄壳: 调用流程仓的 deploy-pipeline.yml reusable workflow

on:
  registry_package:
    types: [published, updated]
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag (for manual test)'
        required: true
        type: string

concurrency:
  group: deploy-eap
  cancel-in-progress: true

permissions:
  packages: read
  contents: read
  issues: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Extract image tag from registry_package payload
        id: extract
        run: |
          # workflow_dispatch: tag 从 input 取
          if [ -n "${{ inputs.image-tag }}" ]; then
            echo "tag=${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # registry_package: 从 container_metadata.tag.name 取 tag
          TAG='${{ github.event.registry_package.package_version.container_metadata.tag.name }}'
          echo "Resolved tag from container_metadata: $TAG"
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            echo "No deployable tag found (tag='$TAG'), skipping deploy"
            exit 0
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.tag != ''
    uses: link-seek/issue-resolver-l1/.github/workflows/deploy-pipeline.yml@main
    with:
      image-tag: ${{ needs.resolve-tag.outputs.tag }}
      runner-label: eap-prod
      ghcr-image: ghcr.io/link-seek/eap-backend
      acr-registry: crpi-fswclfmtgfktdkq7.cn-guangzhou.personal.cr.aliyuncs.com
      acr-namespace: eap-app
      acr-repo: backend
      frontend-url: https://www.xieyucheng.top
      api-url: https://api.xieyucheng.top
      issue-repo: link-seek/enterprise-architecture-platform
      deploy-script: scripts/deploy/deploy.sh
      consumer-repo: link-seek/enterprise-architecture-platform
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      APP_SEED_ADMIN_EMAIL: ${{ secrets.APP_SEED_ADMIN_EMAIL }}
      APP_SEED_ADMIN_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
      SMOKE_TEST_EMAIL: ${{ secrets.APP_SEED_ADMIN_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
