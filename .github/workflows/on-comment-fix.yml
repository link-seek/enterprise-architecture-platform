name: On Comment Fix

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to auto-fix"
        required: true
        type: string
      head_branch:
        description: "PR head branch name"
        required: true
        type: string
      head_sha:
        description: "PR head SHA"
        required: true
        type: string
      max_iterations:
        description: "Max auto-fix iterations (default 10)"
        required: false
        type: number
        default: 10

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: auto-fix-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  fix:
    uses: link-seek/issue-resolver/.github/workflows/fix.yml@main
    with:
      pr-number: ${{ inputs.pr_number }}
      head-branch: ${{ inputs.head_branch }}
      head-sha: ${{ inputs.head_sha }}
      max-iterations: ${{ inputs.max_iterations }}
    secrets:
      LLM_API_KEY_1: ${{ secrets.LLM_API_KEY_1 }}
      LLM_API_KEY_2: ${{ secrets.LLM_API_KEY_2 }}
      LLM_API_KEY_3: ${{ secrets.LLM_API_KEY_3 }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
