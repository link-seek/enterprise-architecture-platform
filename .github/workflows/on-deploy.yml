name: On Deploy

# 能力: deploy
# 触发: 镜像发布 / 手动
# 策略: 全部委托 L1 deploy.yml 决定

on:
  registry_package:
    types: [published, updated]
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag (for manual test)'
        required: true
        type: string
  issues:
    types: [labeled]

concurrency:
  group: deploy-${{ github.event.issue.number || 'eap' }}
  cancel-in-progress: false

permissions:
  packages: read
  contents: read
  issues: write
  actions: write

jobs:
  # deploy-broken label -> L1 deploy.yml (broken handling mode)
  deploy-broken:
    if: |
      github.event_name == 'issues' &&
      github.event.label.name == 'deploy-broken'
    uses: link-seek/issue-resolver-l1/.github/workflows/deploy.yml@main
    with:
      deploy-broken-issue: ${{ github.event.issue.number }}
      issue-repo: link-seek/enterprise-architecture-platform
      consumer-repo: link-seek/enterprise-architecture-platform
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  resolve-tag:
    if: github.event_name == 'registry_package' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Extract image tag
        id: extract
        run: |
          if [ -n "${{ inputs.image-tag }}" ]; then
            echo "tag=${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          TAG='${{ github.event.registry_package.package_version.container_metadata.tag.name }}'
          echo "Resolved tag from container_metadata: $TAG"
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            echo "No deployable tag found (tag='$TAG'), skipping deploy"
            exit 0
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.tag != ''
    uses: link-seek/issue-resolver-l1/.github/workflows/deploy.yml@main
    with:
      image-tag: ${{ needs.resolve-tag.outputs.tag }}
      runner-label: eap-prod
      ghcr-image: ghcr.io/link-seek/eap-backend
      acr-registry: crpi-fswclfmtgfktdkq7.cn-guangzhou.personal.cr.aliyuncs.com
      acr-namespace: eap-app
      acr-repo: backend
      frontend-url: https://www.xieyucheng.top
      api-url: https://api.xieyucheng.top
      issue-repo: link-seek/enterprise-architecture-platform
      deploy-script: scripts/deploy/deploy.sh
      backup-script: scripts/deploy/backup.sh
      rollback-script: scripts/deploy/rollback.sh
      consumer-repo: link-seek/enterprise-architecture-platform
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      APP_SEED_ADMIN_EMAIL: ${{ secrets.APP_SEED_ADMIN_EMAIL }}
      APP_SEED_ADMIN_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
      SMOKE_TEST_EMAIL: ${{ secrets.APP_SEED_ADMIN_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      APP_JWT__SECRET: ${{ secrets.APP_JWT__SECRET }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
