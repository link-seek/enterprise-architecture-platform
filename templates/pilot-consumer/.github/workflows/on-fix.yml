name: On Fix

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # fix-me label on issue -> fix.yml (issue mode)
  fix-issue-label:
    if: |
      github.event_name == 'issues' &&
      github.event.label.name == 'fix-me'
    uses: link-seek/issue-resolver-l1/.github/workflows/fix.yml@v1.0.9-pilot
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets: inherit

  # @oh comment on issue -> fix.yml (issue mode)
  fix-issue-comment:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@oh') &&
      contains('OWNER,MEMBER,COLLABORATOR,CONTRIBUTOR', github.event.comment.author_association)
    uses: link-seek/issue-resolver-l1/.github/workflows/fix.yml@v1.0.9-pilot
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets: inherit
