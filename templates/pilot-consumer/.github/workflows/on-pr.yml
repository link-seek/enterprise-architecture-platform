name: PR CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to run CI for'
        required: true
        type: string

permissions:
  contents: read

jobs:
  pr-ci:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.pr-number != '')
    uses: link-seek/issue-resolver-l1/.github/workflows/pr-ci.yml@v1.0.0-pilot
    with:
      # 试点骨架：后端零依赖 cargo test；前端纯静态，无构建测试
      enable-backend-tests: true
      backend-test-cmd: 'cargo test --manifest-path backend/Cargo.toml'
      enable-frontend-tests: false
      enable-integration: false
      e2e-timeout-minutes: 30
    secrets: inherit
